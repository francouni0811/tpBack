networks:
  backend-net:
    driver: bridge

services:
  api-gateway:
    build: api-gateway
    depends_on:
      - keycloak
      - ms-solicitudes
      - ms-transportes
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - backend-net
    ports:
      - "8080:8080"

  ms-solicitudes:
    build: ms-solicitudes
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sakila
      DB_USER: postgres
      DB_PASS: 123456
    ports:
      - "8081:8081"
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ms-transportes:
    build: ms-transportes
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sakila
      DB_USER: postgres
      DB_PASS: 123456
      # Point resource server to Keycloak using the docker service name (internal network)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://keycloak:8080/realms/tpi-backend"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/certs"
    ports:
      - "8082:8082"
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak:
    command: 
      - start-dev
      - --hostname-strict=false
      - --hostname-strict-https=false
    image: quay.io/keycloak/keycloak:24.0.3
    env_file:
      - .env
    environment:
      KC_PRXY: "edge"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      TZ: America/Argentina/Cordoba
    networks:
      - backend-net
    ports:
      - "8083:8080"
    volumes:
      - ./keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/tpi-backend/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    env_file:
      - .env
    environment:
      TZ: "America/Argentina/Cordoba"
      PGUSER: ${POSTGRES_USER}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    healthcheck:
      interval: 10s
      retries: 10
      test:
        [
          "CMD-SHELL",
          "pg_isready",
          "-U",
          "${POSTGRES_USER}",
          "-d",
          "${POSTGRES_DB}",
        ]
      timeout: 5s
    image: postgres
    networks:
      - backend-net
    restart: always
    volumes:
      - ./data:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql

volumes:
  data:
  keycloak_data:
    external: true
  postgres_data:

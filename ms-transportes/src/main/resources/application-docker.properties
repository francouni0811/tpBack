spring.application.name=ms-transportes
server.port=8082

# PostgreSQL - use Docker service names set via environment in docker-compose
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sakila}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API keys (kept from default; override if needed)
google.maps.apikey=${GOOGLE_MAPS_APIKEY:}

# Clients: when running in Docker use the service name
ms.solicitudes.url=http://ms-solicitudes:8081/api/v1
server.port=${APP_PORT:8082}            

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:tp_backend}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always
